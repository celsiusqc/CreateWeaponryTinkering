plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

def modVersion = project.findProperty("mod_version") ?: "1.0.2-1.20.1"

version = "fabric-1.20.1-$modVersion"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	repositories {

		maven { url = "https://maven.parchmentmc.org" } // Parchment mappings

		maven { url = "https://mvn.devos.one/releases" } // Porting Lib releases
		maven { url = "https://mvn.devos.one/snapshots" } // Create and several dependencies
		maven { url = "https://maven.tterrag.com/" } // Flywheel
		maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
		maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" } // Forge Config API Port

		maven { // Fabric ASM for Porting Lib
			url = "https://jitpack.io/"
			content { includeGroupAndSubgroups("com.github") }
		}

		maven { url = "https://maven.shedaniel.me" } // Cloth Config, REI
		maven { url = "https://maven.blamejared.com" } // JEI

		maven { url = "https://maven.terraformersmc.com/releases" } // Mod Menu, EMI

		maven { url "https://www.cursemaven.com" }

		//maven { url "https://maven.modrinth.com" }

		maven{ (url = "https://maven.teamresourceful.com/repository/maven-public/") }

		maven {
			name "Modding Legacy Maven"
			url "https://maven.moddinglegacy.com/maven"
		}

		maven {
			// Location of the maven that hosts Terrarium and Team Resourceful's files.
			name = "Team Resourceful Maven"
			url = "https://maven.resourcefulbees.com/repository/maven-public/"
		}

		maven {
			url "https://nexus.resourcefulbees.com/repository/telepathicgrunt/"
		}
	}


fabricApi {
	configureDataGeneration()
}

dependencies {

	mappings(loom.layered {
		// Add the base Yarn mappings
		mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")

		// Add fix.tiny as a local mappings layer
		mappings(file("mappings/fix.tiny"))

	})

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Uncomment the following line to enable the deprecated Fabric API modules. 
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"


	//Fabric API
	modImplementation "curse.maven:fabric-api-306612:5105683"

	//JEI
	modImplementation "curse.maven:jei-238222:5101365"

	//Waystones
	//modImplementation "curse.maven:waystones-fabric-500087:4962607"
	//modImplementation "curse.maven:balm-fabric-500525:5140906"

	//CraftTweaker
	//RmodImplementation "curse.maven:crafttweaker-239197:6256145"


	//Ad Astra
//	modImplementation "curse.maven:ad-astra-635042:5116772"
//	implementation("com.teamresourceful:bytecodecs:1.0.2")
//	modImplementation "curse.maven:resourceful-lib-570073:5093330"
//	modImplementation "curse.maven:resourceful-config-714059:5020442"
//	modImplementation "curse.maven:botarium-704113:5118354"
//
//
//	modApi('teamreborn:energy:3.0.0')



	// Create - dependencies are added transitively
		modImplementation("com.simibubi.create:create-fabric-$minecraft_version:$create_version")

	//Ad Astra
		//modImplementation("earth.terrarium.adastra:ad-astra-fabric-$minecraft_version:$ad_astra_version")
		//modImplementation "curse.maven:ad-astra-635042:6262034"

	// Development QOL
		//modLocalRuntime("com.terraformersmc:modmenu:$modmenu_version")

		// Recipe Viewers - Create Fabric supports JEI, REI, and EMI.
		// See root gradle.properties to choose which to use at runtime.
		switch (recipe_viewer.toLowerCase(Locale.ROOT)) {
			case "jei": modLocalRuntime("mezz.jei:jei-$minecraft_version-fabric:$jei_version"); break
			case "rei": modLocalRuntime("me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"); break
			case "emi": modLocalRuntime("dev.emi:emi-fabric:$emi_version"); break
			case "disabled": break
			default: println("Unknown recipe viewer specified: $recipe_viewer. Must be JEI, REI, EMI, or disabled.")
		}
		// if you would like to add integration with them, uncomment them here.
	//    modCompileOnly("mezz.jei:jei-$minecraft_version-fabric:$jei_fabric_version")
	//    modCompileOnly("mezz.jei:jei-$minecraft_version-common:$jei_fabric_version")
	//    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version")
	//    modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:$rei_version")
	//    modCompileOnly("dev.emi:emi:$emi_version")
	}


//
	//Paraglider
	//modImplementation "curse.maven:paragliders-289240:5046071"
	// "curse.maven:forge-config-api-port-fabric-547434:4583000"


	//Hang Glider
//	modImplementation "curse.maven:hang-glider-852668:4710224"
//		modImplementation "curse.maven:puzzles-lib-495476:5112686"
//		modImplementation "curse.maven:cardinal-components-api-318449:4681153"


	//World Edit
	//modImplementation "curse.maven:worldedit-225608:4586218"

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

//java {
//	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
//	// if it is present.
//	// If you remove this line, sources will not be generated.
//	withSourcesJar()
//
//	sourceCompatibility = JavaVersion.VERSION_17
//	targetCompatibility = JavaVersion.VERSION_17
//}
loom {
	runs {
		// This adds a new gradle task that runs the datagen API: "gradlew runDatagen"
		datagen {
			inherit server
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
			vmArg "-Dfabric-api.datagen.modid=createfood"

			runDir "build/datagen"
		}
	}
}
jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}